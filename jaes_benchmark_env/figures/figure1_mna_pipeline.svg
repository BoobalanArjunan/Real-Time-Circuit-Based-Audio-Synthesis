<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="mnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="nrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="decGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="38" font-size="18" font-weight="700" fill="#0f172a">Real-Time Discrete-Time MNA Solver Architecture inside AudioWorklet</text>
  <text x="40" y="60" font-size="12" fill="#64748b">2x Oversampled (96 kHz Internal) Numerical Integration with In-Place Reactive State Preservation</text>

  <!-- Main AudioWorklet Thread Container -->
  <rect x="30" y="80" width="900" height="370" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="50" y="68" width="220" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="160" y="84" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">AudioWorklet Real-Time Thread</text>

  <!-- Audio Block Input Buffer -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="url(#blockGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="65" y="35" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Input Block</text>
    <text x="65" y="55" font-size="11" fill="#64748b" text-anchor="middle">128 Samples</text>
    <text x="65" y="73" font-size="11" fill="#64748b" text-anchor="middle">fs = 48,000 Hz</text>
    <text x="65" y="98" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">T = 2.67 ms</text>
  </g>

  <!-- Arrow to 2x Loop -->
  <line x1="190" y1="225" x2="230" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2x Internal Oversampling Container -->
  <g transform="translate(240, 110)">
    <rect x="0" y="0" width="410" height="240" rx="10" fill="url(#mnaGrad)" stroke="#93c5fd" stroke-width="1.5" />
    <text x="20" y="30" font-size="13" font-weight="700" fill="#1d4ed8">2x Internal Step (fs = 96 kHz)</text>

    <!-- Sub-block 1: MNA Assembly -->
    <rect x="20" y="50" width="160" height="70" rx="6" fill="#ffffff" stroke="#bfdbfe" />
    <text x="100" y="75" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">MNA Matrix Form</text>
    <text x="100" y="95" font-size="11" fill="#475569" text-anchor="middle">A · x(t) = z(t)</text>

    <!-- Sub-block 2: Newton-Raphson Loop -->
    <rect x="220" y="50" width="170" height="70" rx="6" fill="url(#nrGrad)" stroke="#fcd34d" />
    <text x="305" y="75" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Newton–Raphson</text>
    <text x="305" y="95" font-size="11" fill="#78350f" text-anchor="middle">JF(x) · Δx = -F(x)</text>

    <!-- Connectors inside 2x block -->
    <line x1="180" y1="85" x2="218" y2="85" stroke="#2563eb" stroke-width="2" marker-end="url(#blueArrow)" />

    <!-- Feedback loop: Reactive Companion States S1, S2 -->
    <path d="M 305 120 L 305 180 L 100 180 L 100 122" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#orangeArrow)" />
    <text x="202" y="170" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">State Memory S1 (v), S2 (i)</text>
    <text x="202" y="200" font-size="10" fill="#64748b" text-anchor="middle">Preserved In-Place across 60 Hz Sweeps</text>
  </g>

  <!-- Arrow to Decimator -->
  <line x1="650" y1="225" x2="690" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decimation Filter Container -->
  <g transform="translate(700, 160)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="url(#decGrad)" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="65" y="35" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Decimation Filter</text>
    <text x="65" y="55" font-size="11" fill="#047857" text-anchor="middle">23-Tap Symmetric</text>
    <text x="65" y="73" font-size="11" fill="#047857" text-anchor="middle">Blackman Half-Band</text>
    <text x="65" y="98" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">2:1 Downsample</text>
  </g>

  <!-- Arrow to Output -->
  <line x1="830" y1="225" x2="870" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Output Audio Block -->
  <g transform="translate(870, 195)">
    <circle cx="15" cy="30" r="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <text x="15" y="34" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">out</text>
  </g>

  <!-- Control Rate Parameter Update Injection (Top) -->
  <g transform="translate(380, 20)">
    <rect x="0" y="0" width="180" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" />
    <text x="90" y="18" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">60 Hz Parameter Input</text>
    <text x="90" y="32" font-size="10" fill="#64748b" text-anchor="middle">(Gesture / Resistance Sweep)</text>
  </g>
  <line x1="470" y1="62" x2="470" y2="108" stroke="#0f172a" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="510" y="85" font-size="10" font-weight="600" fill="#334155">In-Place wt.set()</text>

  <!-- Zero-Allocation Guarantee Annotation at Bottom -->
  <g transform="translate(60, 395)">
    <rect x="0" y="0" width="840" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="420" y="24" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      Zero Runtime Garbage Collection: Float32Array/Float64Array vectors preallocated; node voltages &amp; branch currents updated in-place.
    </text>
  </g>
</svg>


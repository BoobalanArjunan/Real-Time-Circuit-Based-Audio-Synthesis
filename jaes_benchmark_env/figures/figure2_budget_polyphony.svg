<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="budgetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <linearGradient id="fuzzGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="rcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="wavGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">Polyphonic Processing Time vs. Real-Time Audio Block Deadline</text>
  <text x="40" y="66" font-size="13" fill="#64748b">128 samples @ 48 kHz (Budget = 2,666.67 µs) | Tested on Apple M1 Max under AudioWorklet V8 Runtime</text>

  <!-- Axes & Grid -->
  <g transform="translate(180, 100)">
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="666.67" y2="0" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="60" x2="666.67" y2="60" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="120" x2="666.67" y2="120" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="180" x2="666.67" y2="180" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="240" x2="666.67" y2="240" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="300" x2="666.67" y2="300" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Vertical tick marks (each 500 µs = 125 px, max 2666.67 µs = 666.67 px) -->
    <!-- Scale: 1 µs = 0.25 px -->
    <line x1="0" y1="0" x2="0" y2="305" stroke="#94a3b8" stroke-width="1" />
    <text x="0" y="325" font-size="12" fill="#64748b" text-anchor="middle">0 µs</text>

    <line x1="125" y1="0" x2="125" y2="300" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />
    <text x="125" y="325" font-size="12" fill="#64748b" text-anchor="middle">500 µs</text>

    <line x1="250" y1="0" x2="250" y2="300" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />
    <text x="250" y="325" font-size="12" fill="#64748b" text-anchor="middle">1,000 µs</text>

    <line x1="375" y1="0" x2="375" y2="300" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />
    <text x="375" y="325" font-size="12" fill="#64748b" text-anchor="middle">1,500 µs</text>

    <line x1="500" y1="0" x2="500" y2="300" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />
    <text x="500" y="325" font-size="12" fill="#64748b" text-anchor="middle">2,000 µs</text>

    <!-- Hard Deadline line at 666.67 px (2666.67 µs) -->
    <rect x="661" y="0" width="11" height="300" fill="url(#budgetGrad)" opacity="0.6" />
    <line x1="666.67" y1="0" x2="666.67" y2="300" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="666.67" y="-12" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Audio Deadline (2,666.67 µs)</text>
    <text x="666.67" y="325" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">100% Budget</text>

    <!-- Row 1: 4-Voice MNA Fuzz Stage (Mean = 632.7 µs -> 158.18 px, Max = 841.2 µs -> 210.3 px) -->
    <text x="-20" y="34" font-size="13" font-weight="600" fill="#1e293b" text-anchor="end">4-Voice MNA Fuzz</text>
    <rect x="0" y="15" width="158.2" height="32" rx="4" fill="url(#fuzzGrad)" />
    <!-- Error bar max -->
    <line x1="158.2" y1="31" x2="210.3" y2="31" stroke="#1e293b" stroke-width="2" />
    <line x1="210.3" y1="23" x2="210.3" y2="39" stroke="#1e293b" stroke-width="2" />
    <text x="170" y="36" font-size="12" font-weight="700" fill="#1e40af">632.7 µs (23.73%)</text>

    <!-- Row 2: 4-Voice MNA Half-Wave Rectifier (Mean = 530.9 µs -> 132.73 px) -->
    <text x="-20" y="94" font-size="13" font-weight="600" fill="#1e293b" text-anchor="end">4-Voice MNA Rectifier</text>
    <rect x="0" y="75" width="132.7" height="32" rx="4" fill="url(#rectGrad)" />
    <line x1="132.7" y1="91" x2="171.1" y2="91" stroke="#1e293b" stroke-width="2" />
    <line x1="171.1" y1="83" x2="171.1" y2="99" stroke="#1e293b" stroke-width="2" />
    <text x="145" y="96" font-size="12" font-weight="700" fill="#0e7490">530.9 µs (19.91%)</text>

    <!-- Row 3: 4-Voice MNA RC Filter (Mean = 274.9 µs -> 68.73 px) -->
    <text x="-20" y="154" font-size="13" font-weight="600" fill="#1e293b" text-anchor="end">4-Voice MNA RC Linear</text>
    <rect x="0" y="135" width="68.7" height="32" rx="4" fill="url(#rcGrad)" />
    <line x1="68.7" y1="151" x2="97.3" y2="151" stroke="#1e293b" stroke-width="2" />
    <line x1="97.3" y1="143" x2="97.3" y2="159" stroke="#1e293b" stroke-width="2" />
    <text x="80" y="156" font-size="12" font-weight="700" fill="#047857">274.9 µs (10.31%)</text>

    <!-- Row 4: Cold-Start Block 0 (Mean = 784.5 µs -> 196.1 px, Max = 873.4 µs -> 218.4 px) -->
    <text x="-20" y="214" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="end">Cold-Start Block 0</text>
    <rect x="0" y="195" width="196.1" height="32" rx="4" fill="#f87171" />
    <line x1="196.1" y1="211" x2="218.4" y2="211" stroke="#991b1b" stroke-width="2" />
    <line x1="218.4" y1="203" x2="218.4" y2="219" stroke="#991b1b" stroke-width="2" />
    <text x="230" y="216" font-size="12" font-weight="700" fill="#991b1b">784.5 µs (29.42%) [Max: 873 µs]</text>

    <!-- Row 5: 4-Voice Matched Sample Crossfade (Mean = 55.2 µs -> 13.8 px) -->
    <text x="-20" y="274" font-size="13" font-weight="600" fill="#1e293b" text-anchor="end">4-Voice Sample Baseline</text>
    <rect x="0" y="255" width="13.8" height="32" rx="4" fill="url(#wavGrad)" />
    <line x1="13.8" y1="271" x2="22.2" y2="271" stroke="#1e293b" stroke-width="2" />
    <line x1="22.2" y1="263" x2="22.2" y2="279" stroke="#1e293b" stroke-width="2" />
    <text x="30" y="276" font-size="12" font-weight="700" fill="#6d28d9">55.2 µs (2.07%)</text>
  </g>

  <!-- Footer Annotation -->
  <g transform="translate(180, 455)">
    <rect x="0" y="0" width="670" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="335" y="20" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      Key Result: Steady-state non-linear MNA leaves &gt; 76% audio budget for spatialization with 0.00% missed deadlines.
    </text>
  </g>
</svg>


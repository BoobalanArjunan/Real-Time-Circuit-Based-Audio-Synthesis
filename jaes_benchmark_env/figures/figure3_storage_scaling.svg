<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="mnaStorage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sampleMin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="sampleStd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="sampleFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">Asset Storage Footprint Comparison: Procedural MNA vs. Sample Banks</text>
  <text x="40" y="66" font-size="13" fill="#64748b">Logarithmic Scale: Evaluated across all 61 NodalSynth Pro Presets (Stereo 16-bit PCM @ 48 kHz)</text>

  <!-- Chart Canvas -->
  <g transform="translate(100, 100)">
    <!-- Y-Axis Grid lines (Logarithmic: 10 KB to 10 GB) -->
    <!-- Heights: 340 px total height. Range: 10^4 (10 KB) to 10^10 (10 GB) = 6 decades -> 56.67 px / decade -->
    <!-- 10 GB: y = 0 -->
    <line x1="0" y1="0" x2="720" y2="0" stroke="#e2e8f0" stroke-width="1" />
    <text x="-15" y="5" font-size="12" fill="#64748b" text-anchor="end">10 GB</text>

    <!-- 1 GB: y = 56.7 -->
    <line x1="0" y1="56.7" x2="720" y2="56.7" stroke="#e2e8f0" stroke-width="1" />
    <text x="-15" y="61.7" font-size="12" fill="#64748b" text-anchor="end">1 GB</text>

    <!-- 100 MB: y = 113.3 -->
    <line x1="0" y1="113.3" x2="720" y2="113.3" stroke="#e2e8f0" stroke-width="1" />
    <text x="-15" y="118.3" font-size="12" fill="#64748b" text-anchor="end">100 MB</text>

    <!-- 10 MB: y = 170.0 -->
    <line x1="0" y1="170.0" x2="720" y2="170.0" stroke="#e2e8f0" stroke-width="1" />
    <text x="-15" y="175.0" font-size="12" fill="#64748b" text-anchor="end">10 MB</text>

    <!-- 1 MB: y = 226.7 -->
    <line x1="0" y1="226.7" x2="720" y2="226.7" stroke="#e2e8f0" stroke-width="1" />
    <text x="-15" y="231.7" font-size="12" fill="#64748b" text-anchor="end">1 MB</text>

    <!-- 100 KB: y = 283.3 -->
    <line x1="0" y1="283.3" x2="720" y2="283.3" stroke="#e2e8f0" stroke-width="1" />
    <text x="-15" y="288.3" font-size="12" fill="#64748b" text-anchor="end">100 KB</text>

    <!-- 10 KB (Base): y = 340.0 -->
    <line x1="0" y1="340.0" x2="720" y2="340.0" stroke="#94a3b8" stroke-width="1.5" />
    <text x="-15" y="345.0" font-size="12" fill="#64748b" text-anchor="end">10 KB</text>

    <!-- Bar 1: MNA Netlists (81,130 bytes -> log10(81130) = 4.909. Height from base = (4.909 - 4)*56.67 = 51.5 px -> y = 288.5 px) -->
    <g transform="translate(60, 0)">
      <rect x="0" y="288.5" width="110" height="51.5" rx="4" fill="url(#mnaStorage)" />
      <text x="55" y="278" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">81.1 KB</text>
      <text x="55" y="365" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Procedural MNA</text>
      <text x="55" y="382" font-size="11" fill="#64748b" text-anchor="middle">(61 Netlists)</text>
      <rect x="-10" y="395" width="130" height="24" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="55" y="411" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">1.0x (Baseline)</text>
    </g>

    <!-- Bar 2: Minimal Sample Bank (1,054.08 MB = 1.054e9 bytes -> log10 = 9.023. Height = (9.023 - 4)*56.67 = 284.6 px -> y = 55.4 px) -->
    <g transform="translate(230, 0)">
      <rect x="0" y="55.4" width="110" height="284.6" rx="4" fill="url(#sampleMin)" />
      <text x="55" y="45" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.05 GB</text>
      <text x="55" y="365" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Minimal Coverage</text>
      <text x="55" y="382" font-size="11" fill="#64748b" text-anchor="middle">(2,745 Audio WAVs)</text>
      <rect x="-10" y="395" width="130" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="55" y="411" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">12,992x larger</text>
    </g>

    <!-- Bar 3: Standard Sample Bank (1.686 GB -> log10(1.686e9) = 9.227. Height = (9.227 - 4)*56.67 = 296.2 px -> y = 43.8 px) -->
    <g transform="translate(400, 0)">
      <rect x="0" y="43.8" width="110" height="296.2" rx="4" fill="url(#sampleStd)" />
      <text x="55" y="33" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">1.69 GB</text>
      <text x="55" y="365" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Standard Coverage</text>
      <text x="55" y="382" font-size="11" fill="#64748b" text-anchor="middle">(4,392 Audio WAVs)</text>
      <rect x="-10" y="395" width="130" height="24" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="55" y="411" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">20,788x larger</text>
    </g>

    <!-- Bar 4: Full Chromatic (6.184 GB -> log10(6.184e9) = 9.791. Height = (9.791 - 4)*56.67 = 328.2 px -> y = 11.8 px) -->
    <g transform="translate(570, 0)">
      <rect x="0" y="11.8" width="110" height="328.2" rx="4" fill="url(#sampleFull)" />
      <text x="55" y="0" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">6.18 GB</text>
      <text x="55" y="365" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Full Chromatic</text>
      <text x="55" y="382" font-size="11" fill="#64748b" text-anchor="middle">(16,104 Audio WAVs)</text>
      <rect x="-10" y="395" width="130" height="24" rx="4" fill="#fef2f2" stroke="#fecaca" />
      <text x="55" y="411" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">76,223x larger</text>
    </g>
  </g>

  <!-- Note Footer -->
  <text x="450" y="495" font-size="12" fill="#475569" text-anchor="middle">
    All 61 MNA instruments store complete physics in 81 KB without runtime sample streaming or disk paging bottlenecks.
  </text>
</svg>
